spring.application.name=rest

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs


# ============================================================
# SECURITY / JWT
# ============================================================

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}


# ============================================================
# FILE UPLOAD
# ============================================================

app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:5MB}

# ============================================================
# OPENAI
# ============================================================

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.6-luna
spring.ai.openai.embedding.model=text-embedding-3-small


# ============================================================
# QDRANT
# ============================================================
# Local development defaults to localhost.
# Render/production should override these with environment variables.

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION_NAME:hotel-documents-openai}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}
spring.ai.vectorstore.qdrant.initialize-schema=false


# ============================================================
# DOCKER COMPOSE
# ============================================================

spring.docker.compose.enabled=false

# ============================================================
# MEMORY
# ============================================================

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.openai.chat.reasoning-effort=none

# ============================================================
# MCP CLIENT
# ============================================================

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true


# Hotel Management MCP Server (Streamable HTTP)
spring.ai.mcp.client.streamable-http.connections.hotel.url=${HOTEL_MCP_SERVER_URL:https://hotel-management-mcp-server.onrender.com}
